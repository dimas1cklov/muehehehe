*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:"TT",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;color:#161823}
#wrap{position:fixed;left:0;top:0;overflow:hidden;background:#fff}
#st{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}
.rays{position:absolute;left:50%;top:46%;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,0) 0,#fff 62%),repeating-conic-gradient(rgba(22,24,35,.035) 0 9deg,transparent 9deg 18deg);animation:spin 50s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dots{display:none}
.gl{color:#161823;text-shadow:-3px -2px 0 rgba(37,244,238,.95),3px 2px 0 rgba(254,44,85,.95),0 0 6px rgba(37,244,238,.25),0 0 6px rgba(254,44,85,.25)}
.gl span{color:#FE2C55;text-shadow:-3px -2px 0 rgba(37,244,238,.95),3px 2px 0 rgba(22,24,35,.9)}
/* header */
#hdr{position:absolute;left:0;right:0;top:0;height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20;background:#fff;border-bottom:1px solid rgba(22,24,35,.12)}
.ibtn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{background:#f1f1f2}
.ibtn svg{width:30px;height:30px}
#logo{font-weight:800;font-size:28px;letter-spacing:.2px;color:#161823;text-shadow:-2px -1px 0 #25F4EE,2px 1px 0 #FE2C55}
#bal{height:50px;border-radius:25px;background:#f1f1f2;display:flex;align-items:center;gap:8px;padding:0 18px 0 6px;cursor:pointer;color:#161823;font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
#bal img{width:40px;height:40px}
#bal.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12)}}
.scr{position:absolute;left:0;right:0;top:86px;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:10px 20px 30px}
.scr.on{display:flex}
/* game */
#msg{font-weight:900;font-size:44px;text-align:center;min-height:54px;letter-spacing:-.3px}
#board{position:relative;width:784px;height:300px;flex:none}
.floor{display:none}
.chest{position:absolute;bottom:10px;left:0;width:394px;height:260px;cursor:pointer;will-change:transform;transform-origin:50% 100%;perspective:700px;perspective-origin:50% 10%}
.chest .wob{position:absolute;inset:0;transform-origin:50% 90%}
.chest.pick .wob{animation:bob 1s ease-in-out infinite}
.chest.pick.c1 .wob{animation-delay:.33s}.chest.pick.c2 .wob{animation-delay:.66s}
@keyframes bob{50%{transform:translateY(-14px) scale(1.04)}}
.chest img{display:block;pointer-events:none}
.chest .body{position:absolute;left:0;top:0;width:394px;height:260px}
.chest .lid{position:absolute;left:92px;top:16px;width:216px;height:103px;transform-origin:50% 100%;transform:rotateX(0);opacity:1;transition:transform .3s cubic-bezier(.3,1.6,.5,1) .14s,opacity 0s .14s}
.chest.open .lid{transform:rotateX(92deg);opacity:0;transition:transform .16s ease-in 0s,opacity 0s .16s}
.chest .inner{position:absolute;left:106px;top:14px;width:188px;height:100px;transform-origin:50% 100%;transform:rotateX(90deg);transition:transform .14s ease-in 0s;
 border-radius:46% 46% 6px 6px/40% 40% 6px 6px;background:linear-gradient(#7a0f24,#b51d3b 70%,#d93450);border:9px solid #fbe3a6;box-shadow:inset 0 -10px 18px rgba(0,0,0,.35)}
.chest .inner:before{content:"";position:absolute;left:50%;top:-9px;bottom:-9px;width:44px;margin-left:-22px;background:linear-gradient(90deg,#f3cf82,#fdebbc,#f3cf82)}
.chest.open .inner{transform:rotateX(10deg);transition:transform .38s cubic-bezier(.3,1.6,.5,1) .14s}
.chest .cav{position:absolute;left:100px;top:98px;width:200px;height:30px;border-radius:16px 16px 0 0;background:linear-gradient(#2a0610,#5c0f20);opacity:0;transition:opacity .1s .12s}
.chest.open .cav{opacity:1}
.chest .shine{position:absolute;left:80px;top:-20px;width:240px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,60,.75),rgba(255,214,60,0) 65%);opacity:0;transform:scale(.5);transition:all .3s}
.chest.has.open .shine{opacity:1;transform:scale(1);transition:all .4s .25s}
.chest .pile{position:absolute;left:0;top:0;width:394px;height:260px;opacity:0;transform:translateY(40px);transition:all .15s}
.chest.has.open .pile{opacity:1;transform:translateY(0);transition:transform .4s cubic-bezier(.3,1.7,.5,1) .2s,opacity .1s .2s}
.pile img{position:absolute;width:54px;height:54px;filter:drop-shadow(0 2px 2px rgba(60,0,10,.35))}
.empty{position:absolute;bottom:236px;width:170px;text-align:center;font-weight:700;font-size:22px;color:rgba(22,24,35,.4);display:none}
.empty.on{display:block}
.btn{border:0;outline:0;cursor:pointer;font-weight:700;font-size:28px;color:#fff;padding:0 64px;height:72px;border-radius:8px;background:#FE2C55;font-family:inherit;letter-spacing:.2px}
.btn:active{background:#e0244a;transform:scale(.98)}
.btn.green{background:#FE2C55}
.btn.wide{width:100%}
.btn[disabled]{background:#f1f1f2;color:rgba(22,24,35,.34)}
.btn.hide{visibility:hidden}
/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30}
#modal.on{display:flex}
.card{width:460px;max-width:92%;border-radius:16px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:34px 30px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:cardIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{from{transform:scale(.4);opacity:0}}
.card h2{font-size:50px;font-weight:900}
.card .amt{display:flex;align-items:center;gap:10px;font-size:56px;font-weight:900;color:#161823}
.card .amt img{width:68px;height:68px}
.card p{font-size:21px;font-weight:500;color:rgba(22,24,35,.6)}
/* nick */
.panel{width:520px;max-width:96%;border-radius:16px;background:#fff;border:1px solid rgba(22,24,35,.12);padding:34px 28px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 12px 40px rgba(22,24,35,.10)}
.panel h3{font-size:34px;font-weight:800;color:#161823}
.panel .sub{font-size:20px;font-weight:500;color:rgba(22,24,35,.6);margin-top:-10px;text-align:center}
.drop{display:flex;align-items:center;gap:12px;background:#f1f1f2;border-radius:30px;padding:8px 22px 8px 10px;font-weight:800;font-size:30px;color:#161823}
.drop img{width:50px;height:50px}
.field{width:100%;height:72px;border-radius:8px;border:2px solid transparent;background:#f1f1f2;display:flex;align-items:center;padding:0 8px 0 18px;gap:10px}
.field.ok{border-color:#25F4EE}
.field svg{width:28px;height:28px;flex:none}
#nk{flex:1;min-width:0;border:0;outline:0;font-size:25px;font-weight:600;color:#161823;background:transparent;font-family:inherit;user-select:text;-webkit-user-select:text}
#nk::placeholder{color:rgba(22,24,35,.38)}
#paste{height:54px;border:0;border-radius:6px;background:#FE2C55;color:#fff;font-weight:700;font-size:21px;padding:0 22px;cursor:pointer;font-family:inherit}
#paste:active{transform:scale(.95)}
/* loading: tiktok two-dot loader */
.spin{position:relative;width:120px;height:60px}
.spin:before,.spin:after{content:"";position:absolute;top:10px;width:40px;height:40px;border-radius:50%;mix-blend-mode:multiply}
.spin:before{background:#25F4EE;animation:dl .7s ease-in-out infinite alternate}
.spin:after{background:#FE2C55;animation:dr .7s ease-in-out infinite alternate}
@keyframes dl{from{left:16px;transform:scale(1.1)}to{left:64px;transform:scale(.85)}}
@keyframes dr{from{left:64px;transform:scale(.85)}to{left:16px;transform:scale(1.1)}}
.ltxt{font-size:30px;font-weight:700;color:#161823}
.bar{width:420px;max-width:90%;height:10px;border-radius:5px;background:#f1f1f2;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25F4EE,#FE2C55);border-radius:5px}
.lpct{font-size:24px;font-weight:700;color:rgba(22,24,35,.6);font-variant-numeric:tabular-nums}
/* win */
#winS{gap:14px}
.cg{font-size:54px;font-weight:900;white-space:nowrap;letter-spacing:-.5px;animation:cgIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes cgIn{from{transform:scale(0) rotate(-8deg)}}
.who{font-size:25px;font-weight:600;color:rgba(22,24,35,.6)}
.bigc{position:relative;width:220px;height:220px;flex:none}
.bigc img{position:relative;width:100%;height:100%;animation:float 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
#cnt{font-size:100px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-1px}
#cnt.done{animation:pop .35s}
.added{font-size:24px;font-weight:700;color:#161823;opacity:0;transition:opacity .4s;display:flex;align-items:center;gap:8px}
.added b{width:30px;height:30px;border-radius:50%;background:#20D5EC;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.added.on{opacity:1}
#cf{position:absolute;inset:0;pointer-events:none;z-index:25}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:26}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.burst{position:absolute;width:44px;height:44px;pointer-events:none;z-index:15}
</style>
</head>

function fit(){
 var vv=window.visualViewport, vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
 if(vw>=vh){H=700;W=Math.max(840,Math.round(H*vw/vh));}else{W=800;H=Math.max(1000,Math.round(W*vh/vw));}
 SC=Math.min(vw/W,vh/H);

 if(vv){wrap.style.left=vv.offsetLeft+'px';wrap.style.top=vv.offsetTop+'px';}
 st.style.width=W+'px';st.style.height=H+'px';
 st.style.transform='translate('+Math.round((vw-W*SC)/2)+'px,'+Math.round((vh-H*SC)/2)+'px) scale('+SC+')';
 var c=document.getElementById('cf');c.width=W;c.height=H;
}

// swap animation
var anims=[];
function tween(c,x0,x1,dir,dur,done){
 var t0=performance.now();
 anims.push({c:c,x0:x0,x1:x1,dir:dir,dur:dur,t0:t0,done:done});
 if(anims.length===1)requestAnimationFrame(tick);
}
function tick(now){
 anims=anims.filter(function(a){
  var p=Math.min(1,(now-a.t0)/a.dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  var x=a.x0+(a.x1-a.x0)*e, y=-Math.sin(Math.PI*e)*55*a.dir, s=1+Math.sin(Math.PI*e)*.08*a.dir;
  a.c.style.transform='translate('+x+'px,'+y+'px) scale('+(K*s)+')';a.c.style.zIndex=a.dir>0?3:1;
  if(p>=1){a.c.style.transform='translate('+a.x1+'px,0) scale('+K+')';a.c.style.zIndex=1;if(a.done)a.done();return false}
  return true;});
 if(anims.length)requestAnimationFrame(tick);
}
function shuffle(n){
 var i=0;
 (function step(){
  if(i>=n){phase='pick';$('msg').innerHTML='Find the <span>coins!</span>';chests.forEach(function(c){c.classList.add('pick')});return}
  var a=Math.floor(Math.random()*3),b=(a+1+Math.floor(Math.random()*2))%3;
  var ca=chests.filter(function(c){return c.sl===a})[0], cb=chests.filter(function(c){return c.sl===b})[0];
  var dur=Math.max(190,430-i*24);
  tween(ca,SLOTX[a],SLOTX[b],1,dur);tween(cb,SLOTX[b],SLOTX[a],-1,dur,function(){later(step,40)});
  ca.sl=b;cb.sl=a;i++;
 })();
}
function pickChest(c){
 if(phase!=='pick')return;phase='won';
 chests.forEach(function(x){x.classList.remove('pick')});
 c.classList.add('has');c.classList.add('open');
 $('msg').innerHTML='You found <span>them!</span>';
 var r=board.getBoundingClientRect(), sr=st.getBoundingClientRect();
 later(function(){coinBurst((r.left-sr.left)/SC+SLOTC[c.sl],(r.top-sr.top)/SC+300-10-(260-60)*K)},250);
 later(function(){chests.forEach(function(x){if(x!==c){empties[x.sl].style.left=(SLOTC[x.sl]-85)+'px';empties[x.sl].classList.add('on');x.classList.add('open')}})},650);
 var opts=[5000,10000,15000,25000];prize=opts[Math.floor(Math.random()*opts.length)];
 later(function(){$('wonv').textContent=fmt(prize);$('dropv').textContent=fmt(prize);$('modal').classList.add('on');},1600);
}
function coinBurst(x,y){
 for(var i=0;i<16;i++){(function(i){
  var im=document.createElement('img');im.src=COIN;im.className='burst';st.appendChild(im);
  var a=-Math.PI/2+(Math.random()-.5)*2.4, v=260+Math.random()*260, t0=performance.now(), rot=(Math.random()-.5)*720;
  (function f(now){var t=(now-t0)/1000;if(t>1.1){im.remove();return}
   var px=x+Math.cos(a)*v*t-22, py=y+Math.sin(a)*v*t+600*t*t-22;
   im.style.transform='translate('+px+'px,'+py+'px) rotate('+rot*t+'deg)';im.style.opacity=t>.8?(1.1-t)/.3:1;requestAnimationFrame(f)})(t0);
 })(i)}
}

var cf=$('cf'),cx=cf.getContext('2d'),parts=[],confOn=false,confEnd=0;
var COLS=['#FE2C55','#25F4EE','#161823','#FFC300','#FE2C55','#25F4EE'];
function spawn(n){for(var i=0;i<n;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*120,vy:180+Math.random()*260,
 r:Math.random()*6.28,vr:(Math.random()-.5)*10,w:10+Math.random()*10,h:6+Math.random()*8,c:COLS[Math.floor(Math.random()*COLS.length)],sw:Math.random()*6.28})}
function startConf(){parts=[];spawn(160);confOn=true;confEnd=performance.now()+4500;last=performance.now();requestAnimationFrame(cfl)}
function stopConf(){confOn=false;parts=[];cx.clearRect(0,0,W,H)}
var last=0;
function cfl(now){if(!confOn)return;var dt=Math.min(.05,(now-last)/1000);last=now;
 if(now<confEnd&&parts.length<220)spawn(4);
 cx.clearRect(0,0,W,H);
 parts=parts.filter(function(p){p.sw+=dt*5;p.x+=(p.vx+Math.sin(p.sw)*60)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.sw));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();return p.y<H+30});
 if(parts.length||now<confEnd)requestAnimationFrame(cfl);else stopConf();
}
</script>
</body>
